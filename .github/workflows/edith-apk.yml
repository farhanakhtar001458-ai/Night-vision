name: EDITH debug APK

on:
  push:
    branches:
      - arena/b6d8b915-night-vision
    paths:
      - 'EDITH/android/**'
      - '.github/workflows/edith-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Assemble EDITH debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: EDITH/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK platforms
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1 \
            || "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Gradle assembleDebug
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Record failure log in branch
        if: failure()
        run: |
          {
            echo "# EDITH gradle failure — $(date -u +%FT%TZ)"
            grep -E "^e: |error:|FAILURE:|What went wrong|Caused by:|> " build.log | head -n 200
          } > edith-failure.log
          if [ ! -s edith-failure.log ]; then tail -n 200 build.log > edith-failure.log; fi
          git config user.name 'edith-ci'
          git config user.email 'ci@edith.local'
          git add -f edith-failure.log
          git commit -m "[skip ci] chore: edith build failure log" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true

      - name: Publish APK as GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="edith-$(date -u +%Y%m%d-%H%M%S)"
          cp app/build/outputs/apk/debug/app-debug.apk edith-debug.apk
          gh release create "$tag" edith-debug.apk \
            --title "EDITH assistant APK ($tag)" \
            --notes "EDITH voice assistant, built from ${GITHUB_SHA:0:7}. Install karo, mic + notification access do, phir 'Edith' bolo." \
            --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edith-build-log
          path: EDITH/android/build.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: edith-debug-apk
          path: EDITH/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
