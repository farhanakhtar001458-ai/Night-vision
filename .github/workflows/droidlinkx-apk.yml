name: DroidLink X debug APK

on:
  push:
    branches:
      - arena/b6d8b915-night-vision
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    # Bot commits that only carry a failure log must not start another build.
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: DroidLinkX/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences and install build platform
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1 \
            || "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Gradle build (all modules, unit tests, debug APK)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SIGNALING_URL: ${{ secrets.SIGNALING_URL }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee build-output.log

      - name: Publish compiler errors back to the branch
        if: failure()
        run: |
          mkdir -p artifacts
          {
            echo "# Gradle failure — $(date -u +%FT%TZ)"
            grep -E "^(e: |w: .*error|FAILURE:|\* What went wrong|Caused by:|> )" build-output.log | head -n 300
            echo
            echo "--- last 120 lines ---"
            tail -n 120 build-output.log
          } > artifacts/gradle-failure.log
          cp build-output.log artifacts/gradle-output.log
          git config user.name 'droidlinkx-ci'
          git config user.email 'ci@droidlinkx.local'
          git add -f artifacts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[skip ci] chore: record gradle failure log"
          git push origin HEAD:${GITHUB_REF_NAME}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droidlinkx-build-log
          path: DroidLinkX/android/build-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: droidlinkx-debug-apk
          path: DroidLinkX/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
