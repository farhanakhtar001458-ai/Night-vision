# DroidLink X TURN relay.
# Credentials are minted per connection by the backend (see /api/signaling/turn), which is why only
# the shared secret lives here. Never ship a static TURN password to clients.
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
realm=droidlinkx
# The compose file injects the secret and external IP via CLI flags so this file stays secret-free.
no-cli
no-multicast-peers
no-loopback-peers
no-tcp-relay
stale-nonce=600
total-quota=100
bps-capacity=0
max-bps=1000000
# Block private ranges: a relay must never be usable to reach the host's own LAN.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
# TURN over TLS termination belongs in front of coturn (nginx/HAProxy) with a public certificate.
