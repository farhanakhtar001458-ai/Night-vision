# Supabase CLI project configuration for DroidLink X.
project_id = "droidlinkx"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "2GiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false

[functions.enroll-device]
verify_jwt = true

[functions.revoke-device]
verify_jwt = true

[functions.create-session]
verify_jwt = false

[functions.authorize-connection]
verify_jwt = true

[functions.initiate-transfer]
verify_jwt = true

[functions.generate-secure-download]
verify_jwt = true

[functions.update-device-status]
verify_jwt = false

[functions.finalize-transfer]
verify_jwt = true
